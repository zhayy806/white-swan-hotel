# Fly.io 部署配置
app = "white-swan-hotel"
primary_region = "hkg"  # 香港（离广州最近）

[build]
  dockerfile = "Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[mounts]
  source = "data"
  destination = "/app/chroma_db"

[env]
  HF_ENDPOINT = "https://hf-mirror.com"
  LLM_MODEL = "deepseek-v4-pro"
  LLM_BASE_URL = "https://api.deepseek.com/v1"
